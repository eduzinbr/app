name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Clean and Recreate Android Platform
        run: |
          rm -rf android
          npx cap add android

      - name: Copy Root res/ Folder to Android Project
        run: |
          if [ -d "res" ]; then
            echo "Copiando pasta res/ da raiz para o projeto Android..."
            cp -r res/* android/app/src/main/res/
          else
            echo "Pasta res/ não encontrada na raiz, ignorando..."
          fi

      - name: Inject Custom Kotlin Files
        run: |
          mkdir -p android/app/src/main/java/com/starcord/app

          # 1. Cria o RequestPermissionFragment.kt
          cat << 'EOF' > android/app/src/main/java/com/starcord/app/RequestPermissionFragment.kt
          package com.starcord.app

          import android.Manifest
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.core.content.ContextCompat
          import androidx.fragment.app.Fragment
          import java.io.File

          class RequestPermissionFragment : Fragment() {

              private val requiredPermissions: Array<String>
                  get() {
                      return if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                          arrayOf(
                              Manifest.permission.CAMERA,
                              Manifest.permission.RECORD_AUDIO,
                              Manifest.permission.READ_MEDIA_IMAGES,
                              Manifest.permission.READ_MEDIA_VIDEO,
                              Manifest.permission.READ_MEDIA_AUDIO
                          )
                      } else {
                          arrayOf(
                              Manifest.permission.CAMERA,
                              Manifest.permission.RECORD_AUDIO,
                              Manifest.permission.READ_EXTERNAL_STORAGE,
                              Manifest.permission.WRITE_EXTERNAL_STORAGE
                          )
                      }
                  }

              private val permissionLauncher = registerForActivityResult(
                  ActivityResultContracts.RequestMultiplePermissions()
              ) { permissions ->
                  val allGranted = permissions.entries.all { it.value }
                  if (allGranted) {
                      criarPastaMidiaStarCord()
                  }
                  parentFragmentManager.beginTransaction().remove(this).commit()
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  verificarESolicitar()
              }

              private fun verificarESolicitar() {
                  val missing = requiredPermissions.filter {
                      ContextCompat.checkSelfPermission(requireContext(), it) != PackageManager.PERMISSION_GRANTED
                  }
                  if (missing.isNotEmpty()) {
                      permissionLauncher.launch(missing.toTypedArray())
                  } else {
                      criarPastaMidiaStarCord()
                      parentFragmentManager.beginTransaction().remove(this).commit()
                  }
              }

              private fun criarPastaMidiaStarCord() {
                  val mediaDir = File(requireContext().getExternalFilesDir(null), "midia/starcord")
                  if (!mediaDir.exists()) {
                      mediaDir.mkdirs()
                  }
              }
          }
          EOF

          # 2. Cria o MainActivity.kt integrando o WebChromeClient e o Fragmento de Permissões
          cat << 'EOF' > android/app/src/main/java/com/starcord/app/MainActivity.kt
          package com.starcord.app

          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.webkit.JavascriptInterface
          import android.webkit.PermissionRequest
          import android.webkit.WebChromeClient
          import com.getcapacitor.BridgeActivity

          class MainActivity : BridgeActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  
                  // Libera o acesso de mídia na WebView do Capacitor
                  bridge.webView.webChromeClient = object : WebChromeClient() {
                      override fun onPermissionRequest(request: PermissionRequest?) {
                          request?.grant(request.resources)
                      }
                  }

                  bridge.webView.addJavascriptInterface(WebAppInterface(this), "AndroidBridge")

                  // Dispara o Fragmento para solicitar as permissões nativas ao abrir
                  if (savedInstanceState == null) {
                      supportFragmentManager.beginTransaction()
                          .add(RequestPermissionFragment(), "RequestPermissionFragment")
                          .commit()
                  }
              }

              class WebAppInterface(private val activity: MainActivity) {
                  @JavascriptInterface
                  fun requestOverlayPermission() {
                      if (!Settings.canDrawOverlays(activity)) {
                          val intent = Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:${activity.packageName}")
                          )
                          activity.startActivity(intent)
                      }
                  }

                  @JavascriptInterface
                  fun startService() {
                      if (Settings.canDrawOverlays(activity)) {
                          val intent = Intent(activity, FloatingService::class.java)
                          activity.startService(intent)
                          activity.finishAffinity()
                      }
                  }

                  @JavascriptInterface
                  fun requestMediaPermissions() {
                      activity.runOnUiThread {
                          activity.supportFragmentManager.beginTransaction()
                              .add(RequestPermissionFragment(), "RequestPermissionFragment")
                              .commit()
                      }
                  }

                  @JavascriptInterface
                  fun openAppSettings() {
                      activity.runOnUiThread {
                          val intent = Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS).apply {
                              data = Uri.parse("package:${activity.packageName}")
                          }
                          activity.startActivity(intent)
                      }
                  }
              }
          }
          EOF

          # 3. Cria o FloatingService.kt atualizado para StarCord
          cat << 'EOF' > android/app/src/main/java/com/starcord/app/FloatingService.kt
          package com.starcord.app

          import android.app.Service
          import android.content.Intent
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.IBinder
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.Toast

          class FloatingService : Service() {
              private lateinit var windowManager: WindowManager
              private lateinit var floatingButton: Button

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager

                  floatingButton = Button(this).apply {
                      text = "⭐"
                      setBackgroundColor(0xFF6200EE.toInt())
                      setTextColor(0xFFFFFFFF.toInt())
                      setOnClickListener {
                          Toast.makeText(this@FloatingService, "StarCord Floating Acionado!", Toast.LENGTH_SHORT).show()
                      }
                  }

                  val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      layoutType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 100
                      y = 200
                  }

                  floatingButton.setOnTouchListener(object : View.OnTouchListener {
                      var initialX = 0
                      var initialY = 0
                      var initialTouchX = 0f
                      var initialTouchY = 0f

                      override fun onTouch(v: View, event: MotionEvent): Boolean {
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  initialX = params.x
                                  initialY = params.y
                                  initialTouchX = event.rawX
                                  initialTouchY = event.rawY
                                  return true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  params.x = initialX + (event.rawX - initialTouchX).toInt()
                                  params.y = initialY + (event.rawY - initialTouchY).toInt()
                                  windowManager.updateViewLayout(floatingButton, params)
                                  return true
                              }
                          }
                          return false
                      }
                  })

                  windowManager.addView(floatingButton, params)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  if (::floatingButton.isInitialized) {
                      windowManager.removeView(floatingButton)
                  }
              }
          }
          EOF

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android Project
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

